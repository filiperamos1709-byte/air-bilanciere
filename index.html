<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0A140E" media="(prefers-color-scheme: dark)">
<meta name="description" content="Carica il bilanciere: tocca i dischi e vedi il peso, oppure scrivi il peso e scopri quali dischi mettere. FAR Training.">
<title>Bilanciere · FAR Training</title>
<link rel="icon" type="image/png" href="marchio/favicon.png"><link rel="apple-touch-icon" href="marchio/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Kit FAR Training: verde #00873F, carbone #333333, bianco. Titoli in Montserrat corsivo pesante (al posto del Gilroy), testo in Inter. */
:root{--fondo:#F4F5F2;--riga:#DCE0DA;--blocco:#E2F2E8;--testo:#333333;--tenue:#5E645F;--verde:#00873F;--verde-testo:#006B32;--su-verde:#fff;--chip:#fff;
 --acciaio:#A9B3BA;--acciaio-luce:#DDE2E5;--acciaio-ombra:#6E7A82;
 --display:'Montserrat','Inter',system-ui,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--fondo:#0A140E;--riga:#20352A;--blocco:#0F2A1B;--testo:#EEF3EF;--tenue:#9AB0A2;--verde:#00C25A;--verde-testo:#2FD27A;--su-verde:#03190C;--chip:#112019;
 --acciaio:#8E99A0;--acciaio-luce:#C6CED3;--acciaio-ombra:#56626A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--testo);font:400 15px/1.45 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
::selection{background:var(--verde);color:var(--su-verde)}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
main{width:100%;max-width:760px;margin:0 auto;padding:0 16px 28px;flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* testata: logo a sinistra, nome dello strumento a destra, filetto carbone sotto */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0 14px;margin-bottom:16px;border-bottom:3px solid var(--testo)}
.logo{display:block;line-height:0;flex:none}
.logo img{height:44px;width:auto}
h1{margin:0;text-align:right;font:italic 900 26px/1 var(--display);text-transform:uppercase;letter-spacing:-.005em}
h1 span{display:block;margin-top:5px;font:italic 800 12px/1 var(--display);letter-spacing:.06em;color:var(--verde-testo)}

/* schede: la scelta attiva è un blocco verde inclinato come il logo */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;padding:0 6px}
.tabs button{position:relative;isolation:isolate;padding:12px 8px;border:0;background:none;color:var(--tenue);font:italic 800 16px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;min-height:48px}
.tabs button::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-10deg);border:2px solid var(--riga);background:var(--chip)}
.tabs button[aria-selected=true]{color:var(--su-verde)}
.tabs button[aria-selected=true]::before{background:var(--verde);border-color:var(--verde)}
.tabs button:hover:not([aria-selected=true]){color:var(--testo)}
.tabs button:hover:not([aria-selected=true])::before{border-color:var(--verde)}

.campo{margin:0 0 18px}
.campo label{display:block;font:italic 800 13px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--tenue);margin-bottom:8px}
.campo .riga{display:flex;align-items:stretch;border:2px solid var(--riga);background:var(--chip)}
.campo .riga:focus-within{border-color:var(--verde)}
.campo input{flex:1;min-width:0;border:0;background:none;color:var(--testo);padding:10px 14px;font:italic 900 36px/1 var(--display);-webkit-appearance:none;appearance:none;-moz-appearance:textfield}
.campo input::-webkit-outer-spin-button,.campo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.campo input:focus{outline:none}
.campo input::placeholder{color:var(--tenue);opacity:.45}
.campo .kg{display:grid;place-items:center;padding:0 16px;font:italic 800 18px/1 var(--display);color:var(--tenue)}

.sessi{display:flex;justify-content:center;gap:12px;margin:0 0 6px}
.sessi button{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 16px 6px 10px;border:2px solid var(--riga);background:var(--chip);cursor:pointer;color:var(--tenue)}
.sessi button svg{width:28px;height:28px}
.sessi button b{font:italic 900 18px/1 var(--display)}
.sessi button:hover{border-color:var(--verde)}
.sessi button[aria-pressed=true]{border-color:var(--verde);color:var(--verde-testo);background:var(--blocco)}
.sessi button[aria-pressed=true] b{color:var(--testo)}

.bilanciere{display:block;width:100%;height:auto;margin:4px 0 0;overflow:visible}
.bilanciere .disco-su{cursor:pointer}
.bilanciere .disco-su:hover rect.corpo{filter:brightness(1.12)}
.trova .bilanciere .disco-su{cursor:default}
.trova .bilanciere .disco-su:hover rect.corpo{filter:none}

.lettura{text-align:center;margin:8px 0 14px;min-height:112px}
.etichetta{margin:0 0 6px;font:italic 800 13px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--verde-testo)}
.totale{font:italic 900 64px/1 var(--display);letter-spacing:-.02em}
.totale.lungo{font-size:42px}
.totale small{font-size:.38em;font-weight:800;color:var(--tenue);margin-left:6px;letter-spacing:0}
.dettaglio{margin:8px 0 0;color:var(--tenue);font-size:15px}
.dettaglio b{color:var(--testo);font-weight:700}
.avviso{margin:8px 0 0;color:var(--tenue);font-size:15px}
.scelte{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.scelte button,.azioni button{min-height:44px;padding:8px 16px;border:2px solid var(--riga);background:var(--chip);cursor:pointer;font:italic 800 14px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.scelte button:hover,.azioni button:hover{border-color:var(--verde)}
.azioni{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.azioni button:disabled{opacity:.4;cursor:default;border-color:var(--riga)}

.vassoio-titolo{font:italic 800 13px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--tenue);text-align:center;margin:8px 0 12px}
.vassoio{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.vassoio button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:6px 0 4px;border:0;background:none;cursor:pointer}
.vassoio button svg{display:block;width:var(--d);height:auto;transition:transform .12s ease-out}
.vassoio button:active svg{transform:scale(.92)}
.vassoio .peso{font:italic 800 15px/1 var(--display);white-space:nowrap}
.vassoio .quanti{position:absolute;top:0;right:calc(50% - var(--d)/2 - 8px);min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--verde);color:var(--su-verde);font:italic 900 13px/24px var(--display);text-align:center}
.vassoio .quanti:empty{display:none}
.trova .vassoio button{cursor:default}
.trova .vassoio button:active svg{transform:none}
.trova .vassoio li.spento{opacity:.28}
.nota{margin:14px 0 0;text-align:center;color:var(--tenue);font-size:13px}

/* piede: chi l'ha fatto e i due Instagram */
footer{padding:20px 16px calc(20px + env(safe-area-inset-bottom));text-align:center;border-top:3px solid var(--testo);color:var(--tenue);font-size:14px}
footer p{margin:0}
footer p+p{margin-top:8px}
footer a{color:var(--verde-testo);font-weight:700;text-decoration:none;white-space:nowrap}
footer a:hover{text-decoration:underline;text-underline-offset:3px}
footer svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}

@media (max-width:600px){
 .vassoio{grid-template-columns:repeat(8,1fr);row-gap:14px}
 .vassoio li{grid-column:span 2}
 .vassoio li:nth-child(5){grid-column:2/span 2}
 .totale{font-size:56px}
 .totale.lungo{font-size:34px}
 .logo img{height:36px}
 h1{font-size:21px}
 .tabs button{font-size:14px}
}
@media (max-width:360px){.logo img{height:30px}h1{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pulsa{animation:pulsa .22s ease-out}
@keyframes pulsa{0%{transform:scale(1.06)}100%{transform:scale(1)}}
</style></head>
<body>
<main id="app">
<header>
 <picture class="logo">
  <source srcset="marchio/far-scuro.png" media="(prefers-color-scheme: dark)">
  <img src="marchio/far-chiaro.png" alt="FAR Training" width="480" height="130">
 </picture>
 <h1>Bilanciere<span>Somma e trova i dischi</span></h1>
</header>

<div class="tabs" role="tablist" aria-label="Modalità">
 <button role="tab" id="tab-somma" aria-selected="true" aria-controls="app">Somma i dischi</button>
 <button role="tab" id="tab-trova" aria-selected="false" aria-controls="app">Trova i dischi</button>
</div>

<div class="campo" id="campo" hidden>
 <label for="peso">Peso totale che vuoi sul bilanciere</label>
 <div class="riga"><input id="peso" type="text" inputmode="decimal" autocomplete="off" placeholder="60" maxlength="6"><span class="kg">kg</span></div>
</div>

<div class="sessi" role="group" aria-label="Bilanciere">
 <button type="button" id="b-m" aria-pressed="true" aria-label="Bilanciere uomo, 20 kg">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="19" r="8"/><path d="M18.7 13.3 27 5M20 5h7v7"/></svg>
  <b>20 kg</b>
 </button>
 <button type="button" id="b-f" aria-pressed="false" aria-label="Bilanciere donna, 15 kg">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="11" r="8"/><path d="M16 19v10M11 24.5h10"/></svg>
  <b>15 kg</b>
 </button>
</div>

<svg class="bilanciere" id="bil" viewBox="0 0 1000 300" role="img" aria-label="Bilanciere"></svg>

<div class="lettura" id="lettura" aria-live="polite"></div>

<p class="vassoio-titolo" id="vassoio-titolo">Tocca un disco: va su entrambi i lati</p>
<ul class="vassoio" id="vassoio"></ul>
<p class="nota" id="nota">Tocca un disco sul bilanciere per toglierlo.</p>
</main>

<footer>
 <p>Prodotto da Filipe Ramos · <a href="https://www.instagram.com/coachfiliperamos/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>@coachfiliperamos</a></p>
 <p>FAR Training · <a href="https://www.instagram.com/fartraining/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>@fartraining</a></p>
</footer>

<script>
(()=>{
const DISCHI=[
 {kg:0.5, colore:'#F4F4F1',inchiostro:'#1B1B1B',bordo:'#B9C1C8',alto:74, spess:8, faccia:40},
 {kg:1.5, colore:'#F2C12E',inchiostro:'#1B1B1B',alto:96, spess:10,faccia:48},
 {kg:2.5, colore:'#D62E35',inchiostro:'#fff',  alto:120,spess:13,faccia:56},
 {kg:5,   colore:'#1D1D1F',inchiostro:'#fff',  bordo:'#4A4F55',alto:250,spess:16,faccia:70},
 {kg:10,  colore:'#22964A',inchiostro:'#fff',  alto:250,spess:20,faccia:70},
 {kg:15,  colore:'#F2C12E',inchiostro:'#1B1B1B',alto:250,spess:25,faccia:70},
 {kg:20,  colore:'#1F5FC4',inchiostro:'#fff',  alto:250,spess:30,faccia:70},
];
const PER_KG=Object.fromEntries(DISCHI.map(d=>[d.kg,d]));
const fmt=n=>n.toLocaleString('it-IT',{maximumFractionDigits:1});
const $=id=>document.getElementById(id);
const leggi=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const scrivi=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

const stato={
 sesso: leggi('air-bil-sesso')==='f'?'f':'m',
 modo: leggi('air-bil-modo')==='trova'?'trova':'somma',
 caricati: [],          // kg per lato, nell'ordine in cui sono stati toccati
};
const bar=()=>stato.sesso==='f'?15:20;

// Meno dischi possibili per lato (dischi infiniti); a parità, i più pesanti prima.
function soluzione(perLato){
 const u=Math.round(perLato*2); // in mezzi chili
 const tagli=DISCHI.map(d=>Math.round(d.kg*2)).sort((a,b)=>b-a);
 const dp=new Array(u+1).fill(Infinity); dp[0]=0;
 for(let i=1;i<=u;i++) for(const t of tagli) if(t<=i&&dp[i-t]+1<dp[i]) dp[i]=dp[i-t]+1;
 const out=[]; let r=u;
 while(r>0){ for(const t of tagli){ if(t<=r&&dp[r-t]===dp[r]-1){out.push(t/2);r-=t;break;} } }
 return out;
}

// ---------- disegno del bilanciere ----------
const NS='http://www.w3.org/2000/svg';
function el(tag,attr,figli){const e=document.createElementNS(NS,tag);for(const k in attr)e.setAttribute(k,attr[k]);(figli||[]).forEach(f=>e.appendChild(f));return e}
const CY=150, COLL_SX=290, COLL_DX=710, MANICA=258; // lunghezza utile di ogni manica
function disegnaBar(lato){
 const svg=$('bil'); svg.textContent='';
 const defs=el('defs',{},[
  el('linearGradient',{id:'acc',x1:0,y1:0,x2:0,y2:1},[
   el('stop',{offset:0,style:'stop-color:var(--acciaio-luce)'}),el('stop',{offset:.55,style:'stop-color:var(--acciaio)'}),el('stop',{offset:1,style:'stop-color:var(--acciaio-ombra)'})]),
  el('linearGradient',{id:'luce',x1:0,y1:0,x2:1,y2:0},[
   el('stop',{offset:0,'stop-color':'#fff','stop-opacity':.22}),el('stop',{offset:.5,'stop-color':'#fff','stop-opacity':0}),el('stop',{offset:1,'stop-color':'#000','stop-opacity':.18})])
 ]);
 svg.appendChild(defs);
 // asta e zigrinatura
 svg.appendChild(el('rect',{x:COLL_SX,y:CY-7,width:COLL_DX-COLL_SX,height:14,rx:3,fill:'url(#acc)'}));
 const zig=el('g',{style:'stroke:var(--acciaio-ombra)','stroke-width':1.2,opacity:.55});
 for(const [a,b] of [[330,470],[530,670]]) for(let x=a;x<=b;x+=6) zig.appendChild(el('line',{x1:x,y1:CY-6,x2:x+4,y2:CY+6}));
 svg.appendChild(zig);
 // maniche
 svg.appendChild(el('rect',{x:COLL_SX-MANICA-12,y:CY-15,width:MANICA+12,height:30,rx:4,fill:'url(#acc)'}));
 svg.appendChild(el('rect',{x:COLL_DX,y:CY-15,width:MANICA+12,height:30,rx:4,fill:'url(#acc)'}));
 // dischi (i più pesanti verso il collare)
 const ord=[...lato].sort((a,b)=>b-a);
 const tot=ord.reduce((s,k)=>s+PER_KG[k].spess+2,0);
 const scala=tot>MANICA?MANICA/tot:1;
 const gSx=el('g',{}),gDx=el('g',{});
 let xs=COLL_SX-4, xd=COLL_DX+4;
 ord.forEach((k,i)=>{
  const d=PER_KG[k], w=d.spess*scala, h=d.alto, y=CY-h/2;
  xs-=w; const a=disco(d,xs,y,w,h,k); gSx.appendChild(a); xs-=2*scala;
  const b=disco(d,xd,y,w,h,k); gDx.appendChild(b); xd+=w+2*scala;
 });
 svg.appendChild(gSx); svg.appendChild(gDx);
 // collari
 svg.appendChild(el('rect',{x:COLL_SX-4,y:CY-30,width:12,height:60,rx:3,fill:'url(#acc)'}));
 svg.appendChild(el('rect',{x:COLL_DX-8,y:CY-30,width:12,height:60,rx:3,fill:'url(#acc)'}));
 svg.setAttribute('aria-label', ord.length?`Bilanciere da ${bar()} kg con, per lato: ${ord.map(fmt).join(', ')} kg`:`Bilanciere da ${bar()} kg, vuoto`);
}
function disco(d,x,y,w,h,k){
 const g=el('g',{class:'disco-su','data-kg':k});
 g.appendChild(el('rect',{class:'corpo',x,y,width:w,height:h,rx:Math.min(4,w/3),fill:d.colore,stroke:d.bordo||'none','stroke-width':d.bordo?1.5:0}));
 g.appendChild(el('rect',{x,y,width:w,height:h,rx:Math.min(4,w/3),fill:'url(#luce)','pointer-events':'none'}));
 if(stato.modo==='somma'){ const t=el('title'); t.textContent=`Togli ${fmt(k)} kg`; g.appendChild(t); }
 return g;
}

// ---------- vassoio ----------
function faccia(d){
 const r=50;
 return `<svg viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="${r-1}" fill="${d.colore}" ${d.bordo?`stroke="${d.bordo}" stroke-width="2"`:''}/>
  <circle cx="50" cy="50" r="${r-9}" fill="none" stroke="${d.inchiostro}" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="50" cy="50" r="15" style="fill:var(--acciaio);stroke:var(--acciaio-ombra)" stroke-width="2"/>
  <circle cx="50" cy="50" r="8" style="fill:var(--fondo)"/>
 </svg>`;
}
function montaVassoio(){
 $('vassoio').innerHTML=DISCHI.map(d=>`<li data-kg="${d.kg}"><button type="button" data-kg="${d.kg}" style="--d:${d.faccia}px" aria-label="Aggiungi ${fmt(d.kg)} kg per lato">${faccia(d)}<span class="peso">${fmt(d.kg)} kg</span><span class="quanti"></span></button></li>`).join('');
}

// ---------- lettura ----------
function render(){
 const app=$('app'), somma=stato.modo==='somma';
 app.classList.toggle('trova',!somma);
 $('tab-somma').setAttribute('aria-selected',somma); $('tab-trova').setAttribute('aria-selected',!somma);
 $('campo').hidden=somma;
 $('b-m').setAttribute('aria-pressed',stato.sesso==='m'); $('b-f').setAttribute('aria-pressed',stato.sesso==='f');
 $('vassoio-titolo').textContent=somma?'Tocca un disco: va su entrambi i lati':'Dischi per lato';
 $('nota').hidden=!somma||!stato.caricati.length;
 document.querySelectorAll('.vassoio button').forEach(b=>{b.tabIndex=somma?0:-1; b.setAttribute('aria-hidden',somma?'false':'true');});

 let lato=[]; const L=$('lettura');
 if(somma){
  lato=stato.caricati;
  const dischi=lato.reduce((s,k)=>s+k,0), tot=bar()+2*dischi;
  L.innerHTML=`<p class="etichetta">Carico totale</p><div class="totale" id="num">${fmt(tot)}<small>kg</small></div>
   <p class="dettaglio">${lato.length?`Bilanciere <b>${bar()}</b> + per lato <b>${[...lato].sort((a,b)=>b-a).map(fmt).join(' + ')}</b>`:`Solo bilanciere: <b>${bar()} kg</b>`}</p>
   <div class="azioni"><button type="button" id="togli" ${lato.length?'':'disabled'}>Togli l'ultimo</button><button type="button" id="svuota" ${lato.length?'':'disabled'}>Svuota</button></div>`;
 } else {
  const raw=$('peso').value.trim().replace(',','.');
  const v=parseFloat(raw);
  if(!raw||isNaN(v)){
   L.innerHTML=`<p class="avviso">Scrivi il peso totale e ti dico cosa mettere per lato.</p>`;
  } else if(v<bar()){
   L.innerHTML=`<p class="etichetta">Carico totale</p><div class="totale">${fmt(bar())}<small>kg</small></div><p class="avviso">Il bilanciere da solo pesa già ${bar()} kg.</p>`;
  } else {
   const resto=v-bar();
   const giu=bar()+Math.floor(resto+1e-9), su=giu+1;
   const esatto=Math.abs(resto-Math.round(resto))<1e-9;
   const obiettivo=esatto?v:giu;
   lato=soluzione((obiettivo-bar())/2);
   const conta={}; lato.forEach(k=>conta[k]=(conta[k]||0)+1);
   const elenco=Object.keys(conta).map(Number).sort((a,b)=>b-a).map(k=>conta[k]>1?`${conta[k]} × ${fmt(k)}`:fmt(k)).join(' + ');
   L.innerHTML=(lato.length
     ?`<p class="etichetta">Per lato</p><div class="totale${elenco.length>11?' lungo':''}">${elenco}<small>kg</small></div>
       <p class="dettaglio">Bilanciere <b>${bar()}</b> + 2 × <b>${fmt((obiettivo-bar())/2)}</b> = <b>${fmt(obiettivo)} kg</b> · ${lato.length} ${lato.length===1?'disco':'dischi'} per lato</p>`
     :`<p class="etichetta">Per lato</p><div class="totale">0<small>kg</small></div><p class="dettaglio">Solo bilanciere: <b>${bar()} kg</b></p>`)
    +(esatto?'':`<p class="avviso">${fmt(v)} kg esatti non si fanno: i dischi vanno a coppie, quindi si sale di 1 kg alla volta.</p>
       <div class="scelte"><button type="button" data-vai="${giu}">${fmt(giu)} kg</button><button type="button" data-vai="${su}">${fmt(su)} kg</button></div>`);
  }
 }
 disegnaBar(lato);
 const conta={}; lato.forEach(k=>conta[k]=(conta[k]||0)+1);
 document.querySelectorAll('.vassoio li').forEach(li=>{
  const k=li.dataset.kg, n=conta[k]||0;
  li.querySelector('.quanti').textContent=n?(somma?`×${n}`:`${n}`):'';
  li.classList.toggle('spento',!somma&&!n);
 });
}
function pulsa(){const n=$('num'); if(n){n.classList.remove('pulsa'); void n.offsetWidth; n.classList.add('pulsa');}}

// ---------- eventi ----------
$('vassoio').addEventListener('click',e=>{
 const b=e.target.closest('button'); if(!b||stato.modo!=='somma') return;
 stato.caricati.push(Number(b.dataset.kg));
 if(navigator.vibrate) try{navigator.vibrate(8)}catch(_){}
 render(); pulsa();
});
$('bil').addEventListener('click',e=>{
 const g=e.target.closest('.disco-su'); if(!g||stato.modo!=='somma') return;
 const k=Number(g.dataset.kg), i=stato.caricati.lastIndexOf(k);
 if(i>-1){stato.caricati.splice(i,1); render(); pulsa();}
});
$('lettura').addEventListener('click',e=>{
 const b=e.target.closest('button'); if(!b) return;
 if(b.id==='togli'){stato.caricati.pop(); render(); pulsa();}
 else if(b.id==='svuota'){stato.caricati=[]; render(); pulsa();}
 else if(b.dataset.vai){$('peso').value=fmt(Number(b.dataset.vai)); render();}
});
function sesso(s){stato.sesso=s; scrivi('air-bil-sesso',s); render(); pulsa();}
$('b-m').addEventListener('click',()=>sesso('m'));
$('b-f').addEventListener('click',()=>sesso('f'));
function modo(m){stato.modo=m; scrivi('air-bil-modo',m); render(); if(m==='trova') $('peso').focus({preventScroll:true});}
$('tab-somma').addEventListener('click',()=>modo('somma'));
$('tab-trova').addEventListener('click',()=>modo('trova'));
document.querySelector('.tabs').addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const m=stato.modo==='somma'?'trova':'somma'; modo(m); $('tab-'+m).focus();}
});
$('peso').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9.,]/g,''); render();});

montaVassoio(); render();
})();
</script>
</body></html>
